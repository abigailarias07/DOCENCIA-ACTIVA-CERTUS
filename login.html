<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOCENCIA ACTIVA CERTUS</title>
  <link rel="stylesheet" href="CSS/login.css">
</head>
<body>

  <br>

  <center>
    <img src="img/certus-logo001.png" alt="Logo CERTUS" width="170">
  </center>

  <br>

  <center>
    <table  border="1" bordercolor="00000" cellpadding="35" cellspacing="0" width="600">
      <tr>
        <td>

          <center>
            <h2>INICIAR SESIÓN</h2>
            <h4>Bienvenido a la plataforma educativa DOCENCIA ACTIVA CERTUS</h4>
          </center>

          <form action="#" method="post">

            <label for="correo">Correo Institucional:</label>
            <br>
            <input type="email" id="correo" name="correo" size="50" placeholder="Ingrese su correo institucional" required>
            <br><br>

            <label for="contrasenia">Ingrese su clave de acceso:</label>
            <br>
            <input type="password" id="contrasenia" name="contrasenia" size="50" placeholder="Ingrese su clave de acceso" required>
            <br><br>

            <input type="checkbox" id="recordar_contrasenia" name="recordar_contrasenia">
            <label for="recordar_contrasenia">Recordar inicio de sesión</label>

            <br><br><br>

            <center>
              <button type="submit" class="boton-ingresar">Ingresar</button>
            </center>
            <center>
                <p id="parrafo-peque">Al ingresar acepta todos los terminos de politica de privacidad</p>
            </center>
          </form>

        </td>
      </tr>
    </table>
  </center>

  <br><br>
  <hr>
  <footer>
    <center>
      <p id="footers">&copy; 2026 EDUCACION ACTIVA CERTUS. Todos los derechos reservados.</p>
    </center>
  </footer>

  <script src="script.js"></script>
</body>
</html>
