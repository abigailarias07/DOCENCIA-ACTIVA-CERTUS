<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOCENCIA ACTIVA CERTUS</title>
  <link rel="stylesheet" href="/CSS/login.css">
</head>
<body>

  <header class="encabezado">
    <img src="/img/certus-logo001.png" alt="Logo CERTUS" width="170">
  </header>

  <main class="contenedor-login">
    <section class="tarjeta-login">
      
      <div class="titulo-login">
        <h1>INICIAR SESIÓN</h1>
        <p>Bienvenido a la plataforma educativa DOCENCIA ACTIVA CERTUS</p>
      </div>

      <form action="#" method="post">
        <div class="campo-formulario">
          <label for="correo">Correo Institucional:</label>
          <input type="email" id="correo" name="correo" placeholder="Ingrese su correo institucional" required>
        </div>

        <div class="campo-formulario">
          <label for="contrasenia">Ingrese su clave de acceso:</label>
          <input type="password" id="contrasenia" name="contrasenia" placeholder="Ingrese su clave de acceso" required>
        </div>

        <div class="campo-checkbox">
          <input type="checkbox" id="recordar_contrasenia" name="recordar_contrasenia">
          <label for="recordar_contrasenia">Recordar inicio de sesión</label>
        </div>

        <div class="acciones-formulario">
          <button type="submit" class="boton-ingresar">Ingresar</button>
          <p id="parrafo-peque">Al ingresar acepta todos los términos de política de privacidad</p>
        </div>
      </form>

    </section>
  </main>

  <hr>
  
  <footer>
    <p id="footers">&copy; 2026 EDUCACIÓN ACTIVA CERTUS. Todos los derechos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
