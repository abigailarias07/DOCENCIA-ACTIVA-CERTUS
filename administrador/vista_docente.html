<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOCENCIA ACTIVA CERTUS - Docentes</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header id="header-lista">
    <nav>
      <a href="index.html" aria-label="Volver">&lt;</a>
      <a href="index.html">
        <img src="/img/certus-logo001.png" alt="Logo Certus" width="100">
      </a>
    </nav>
  </header>

  
  <main class="vista_docente">

    <!-- Panel Izquierdo: Información del Docente -->
    <aside class="info-docente">
      <div class="cabecera-perfil">
        <button type="button" id="btn-cerrar-ver" aria-label="Cerrar detalle">X</button>
        <img src="/img/" alt="Foto docente" width="80">
        <h2>Nombre del docente</h2>
      </div>

      <div class="datos-docente">
        <p class="campo-dato">Correo electrónico</p>
        <p class="campo-dato">DNI del docente</p>
      </div>

      <button type="button" class="btn-deshabilitar">DESHABILITAR PERFIL</button>
    </aside>

    <!-- Panel Derecho: Historial de Capacitaciones -->
    <section class="panel-derecho">
      <div class="caja-capacitaciones">
        <hr>
        <h2>HISTORIAL DE CAPACITACIONES</h2>
        <hr>
        <div class="grupo-capacitacion">
          <h3>CAPACITACIONES ASIGNADAS</h3>
          <article class="capacitacion-asignado">
            <h4>Excel Básico para Docentes</h4>
            <img src="img/curso_excel.png" alt="Excel Básico para Docentes" width="80">
          </article>
        </div>
<hr>
        <div class="grupo-capacitacion">
          <h3>CAPACITACIONES EN PROGRESO</h3>
          <article class="capacitaciones-progreso">
            <h4>Excel Básico para Docentes</h4>
            <img src="img/curso_excel.png" alt="Excel Básico para Docentes" width="80">
            <div class="porcentaje-progreso"></div>
          </article>
        </div>
     <hr>
        <div class="grupo-capacitacion">
          <h3>CAPACITACIONES CULMINADAS</h3>
          <article class="capacitaciones-culminadas">
            <h4>Excel Básico para Docentes</h4>
            <img src="img/curso_excel.png" alt="Excel Básico para Docentes" width="80">
          </article>
        </div>

      </div>
    </section>

  </main>

</body>
</html>
