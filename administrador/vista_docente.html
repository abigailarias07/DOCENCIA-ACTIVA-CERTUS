<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOCENCIA ACTIVA CERTUS - Perfil Docente</title>
  <link rel="stylesheet" href="/CSS/vista_docente.css">
</head>
<body>

  <header id="header-lista">
    <nav>
      <a href="index.html" aria-label="Volver">&lt;</a>
      <a href="index.html">
         <img src="../img/certus-logo001.png" alt="Logo Certus" width="100">
      </a>
    </nav>
  </header>

  <main class="vista_docente">

    <!-- Panel Izquierdo: Información del Docente -->
    <aside class="info-docente">
      <div class="cabecera-perfil">
        <button type="button" id="btn-cerrar-ver" aria-label="Cerrar detalle">X</button>
        <img id="docente-foto" src="../img/icono-docente.png" alt="Foto docente" width="80">
        <h2 id="docente-nombre">Cargando docente...</h2>
      </div>

      <div class="datos-docente">
        <p class="campo-dato" id="docente-correo">Correo electrónico</p>
        <p class="campo-dato" id="docente-dni">DNI del docente</p>
      </div>

      <!-- Botón dinámico: cambia entre DESHABILITAR PERFIL y HABILITAR PERFIL -->
      <button type="button" id="btn-estado-perfil" class="btn-deshabilitar">DESHABILITAR PERFIL</button>
    </aside>

    <!-- Panel Derecho: Historial de Capacitaciones -->
    <section class="panel-derecho">
      <div class="caja-capacitaciones">
        <hr>
        <h2>HISTORIAL DE CAPACITACIONES</h2>
        <hr>
        
        <div class="grupo-capacitacion" id="lista-asignadas">
          <h3>CAPACITACIONES ASIGNADAS</h3>
          <!-- Aquí JS cargará las asignadas desde MySQL -->
        </div>
        
        <hr>
        
        <div class="grupo-capacitacion" id="lista-progreso">
          <h3>CAPACITACIONES EN PROGRESO</h3>
          <!-- Aquí JS cargará las que están en progreso con su barra/porcentaje -->
        </div>
        
        <hr>
        
        <div class="grupo-capacitacion" id="lista-culminadas">
          <h3>CAPACITACIONES CULMINADAS</h3>
          <!-- Aquí JS cargará las culminadas -->
        </div>

      </div>
    </section>

  </main>

  <script type="module" src="../JS/vista-docente.js"></script>
</body>
</html>
