<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CERTUS - Ingresa el código</title>
</head>
<body background="recursos/fondos/fondo_edificio.png">
  <header>
    <a href="#"><img src="recursos/logos/logo_certus_blanco.png" alt="CERTUS" height="40"></a>
  </header>
  <main align="center">
    <h1>INGRESA EL CÓDIGO</h1>
    <p>Ingresa el código de 6 dígitos que te enviamos a tu correo.</p>
    <form action="#" method="post">
      <label for="cod1">Código de verificación</label><br>
      <input type="text" id="cod1" name="cod1" maxlength="1" inputmode="numeric" size="1">
      <input type="text" name="cod2" maxlength="1" inputmode="numeric" size="1" aria-label="Dígito 2">
      <input type="text" name="cod3" maxlength="1" inputmode="numeric" size="1" aria-label="Dígito 3">
      <input type="text" name="cod4" maxlength="1" inputmode="numeric" size="1" aria-label="Dígito 4">
      <input type="text" name="cod5" maxlength="1" inputmode="numeric" size="1" aria-label="Dígito 5">
      <input type="text" name="cod6" maxlength="1" inputmode="numeric" size="1" aria-label="Dígito 6">
      <br>
      <input type="image" src="recursos/botones/continuar.png" alt="CONTINUAR" height="36">
    </form>
    <p>¿No recibiste el código?</p>
    <button type="button">Reenviar código</button>
    <p><a href="#">Volver al inicio de sesión</a></p>
  </main>
  <footer align="center">
    <p>2026 CERTUS · EDUCACIÓN SUPERIOR</p>
  </footer>
</body>
</html>
