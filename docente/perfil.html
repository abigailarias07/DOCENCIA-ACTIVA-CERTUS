<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | CERTUS</title>
  <link rel="stylesheet" href="css/estilos_docente.css">
<script type="module" src="js/docente.js"></script>
</head>
<body>
<header class="encabezado">
  <a class="marca" href="mis_capacitaciones.html"><img src="../img/certus-logo001.png" alt="CERTUS" width="144" height="39"></a>
  <nav class="navegacion" aria-label="Navegación del docente">
    <a href="mis_capacitaciones.html">Mis capacitaciones</a>
    <a href="mis_constancias.html">Constancias</a>
  </nav>
  <div class="acciones">
    <a class="accion-icono" href="notificaciones.html" aria-label="Notificaciones">&#128276;<span id="contador-avisos" class="contador">2</span></a>
    <a class="accion-icono" href="perfil.html" aria-label="Mi perfil">&#128100;</a>
  </div>
</header>
<main>
  <div class="contenedor">
    <a class="volver" href="mis_capacitaciones.html">← Volver a mis capacitaciones</a>
    <h1>Mi perfil</h1>
    <section class="panel">
      <h2>Datos del docente</h2>
      <dl class="datos-perfil">
        <dt>Perfil</dt><dd>Docente</dd>
        <dt>Nombre</dt><dd id="nombre-perfil">Cargando...</dd>
        <dt>Correo institucional</dt><dd id="correo-perfil">No se ha registrado un correo</dd>
      </dl>
      <div class="enlaces-perfil">
        <a class="boton" href="mis_constancias.html">Mis constancias</a>
        <button type="button" class="boton suave" id="btn-abrir-clave-docente">Cambiar contraseña</button>
        <a class="boton secundario" href="login.html" id="cerrar-sesion">Cerrar sesión</a>
      </div>
    </section>

    <!-- Modal para cambiar contraseña dentro de la sesión del docente -->
    <dialog id="modal-clave-docente" style="border: none; border-radius: 12px; padding: 24px; max-width: 420px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin: 0; font-size: 1.2rem;">Cambiar contraseña</h2>
        <button type="button" id="btn-cerrar-clave-docente" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <form id="form-cambiar-clave-docente">
        <div class="campo">
          <label for="clave-actual-docente">Contraseña actual</label>
          <div class="entrada-clave">
            <input type="password" id="clave-actual-docente" autocomplete="current-password" required>
            <button type="button" class="mostrar-clave" data-mostrar-clave="clave-actual-docente">Mostrar</button>
          </div>
        </div>
        <div class="campo">
          <label for="clave-nueva-docente">Nueva contraseña (mínimo 6 caracteres)</label>
          <div class="entrada-clave">
            <input type="password" id="clave-nueva-docente" minlength="6" autocomplete="new-password" required>
            <button type="button" class="mostrar-clave" data-mostrar-clave="clave-nueva-docente">Mostrar</button>
          </div>
        </div>
        <div class="campo">
          <label for="clave-confirmar-docente">Confirmar nueva contraseña</label>
          <div class="entrada-clave">
            <input type="password" id="clave-confirmar-docente" minlength="6" autocomplete="new-password" required>
            <button type="button" class="mostrar-clave" data-mostrar-clave="clave-confirmar-docente">Mostrar</button>
          </div>
        </div>
        <p class="mensaje" id="mensaje-clave-docente" role="alert"></p>
        <button type="submit" class="boton bloque">Guardar nueva contraseña</button>
      </form>
    </dialog>
  </div>
</main>
<footer class="pie">2026 CERTUS - EDUCACIÓN SUPERIOR</footer>
</body>
</html>
