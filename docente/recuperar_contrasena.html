<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CERTUS - Recuperar contraseña</title>
</head>
<body background="recursos/fondos/fondo_edificio.png">
  <header>
    <a href="#"><img src="recursos/logos/logo_certus_blanco.png" alt="CERTUS" height="40"></a>
  </header>
  <main align="center">
    <h1>RECUPERAR CONTRASEÑA</h1>
    <p>Ingresa tu correo institucional para enviarte un código de verificación.</p>
    <form action="#" method="post">
      <img src="recursos/iconos/correo.png" alt="Correo" height="20">
      <label for="correo">Correo institucional</label>
      <input type="email" id="correo" name="correo" placeholder="Ingrese su correo institucional">
      <br>
      <button type="submit">ENVIAR CÓDIGO</button>
    </form>
    <p><a href="#">Volver al inicio de sesión</a></p>
  </main>
  <footer align="center">
    <p>2026 CERTUS · EDUCACIÓN SUPERIOR</p>
  </footer>
</body>
</html>
