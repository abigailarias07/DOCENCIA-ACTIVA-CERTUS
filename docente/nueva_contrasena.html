<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CERTUS - Nueva contraseña</title>
</head>
<body background="recursos/fondos/fondo_edificio.png">
  <header>
    <a href="#"><img src="recursos/logos/logo_certus_blanco.png" alt="CERTUS" height="40"></a>
  </header>
  <main align="center">
    <img src="recursos/iconos/candado.png" alt="Candado" height="48">
    <h1>Nueva Contraseña</h1>
    <p>Ingresa y confirma tu nueva contraseña.</p>
    <form action="#" method="post">
      <label for="nueva">Nueva contraseña</label><br>
      <input type="password" id="nueva" name="nueva" placeholder="Ingrese su nueva contraseña">
      <br>
      <label for="confirmar">Confirmar contraseña</label><br>
      <input type="password" id="confirmar" name="confirmar" placeholder="Confirme su nueva contraseña">
      <br>
      <input type="image" src="recursos/botones/cambiar_contrasena.png" alt="Cambiar contraseña" height="36">
    </form>
  </main>
  <footer align="center">
    <p>2026 CERTUS · EDUCACIÓN SUPERIOR</p>
  </footer>
</body>
</html>
