<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CERTUS - Login</title>
</head>
<body background="recursos/fondos/fondo_edificio.png">
  <header>
    <a href="#"><img src="recursos/logos/logo_certus_blanco.png" alt="CERTUS" height="40"></a>
  </header>
  <main align="center">
    <h1>INICIAR SESIÓN</h1>
    <form action="#" method="post">
      <label for="correo">Correo institucional:</label><br>
      <img src="recursos/iconos/correo.png" alt="Correo" height="20">
      <input type="email" id="correo" name="correo" placeholder="Ingrese su correo institucional">
      <br>
      <label for="clave">Contraseña:</label><br>
      <img src="recursos/iconos/candado.png" alt="Contraseña" height="20">
      <input type="password" id="clave" name="clave" placeholder="Ingrese su contraseña">
      <button type="button"><img src="recursos/iconos/ocultar_contrasena.png" alt="Mostrar u ocultar contraseña" height="20"></button>
      <br>
      <input type="checkbox" id="recordar" name="recordar">
      <label for="recordar">Recordar inicio de sesión</label>
      <br>
      <input type="image" src="recursos/botones/iniciar_sesion.png" alt="INGRESAR" height="36">
      <br>
      <a href="#">¿Olvidé mi contraseña?</a>
    </form>
  </main>
  <footer align="center">
    <p>2026 CERTUS · EDUCACIÓN SUPERIOR</p>
  </footer>
</body>
</html>
