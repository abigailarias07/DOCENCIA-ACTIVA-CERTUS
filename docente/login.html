<!DOCTYPE html>
<html lang="es">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Iniciar sesión | CERTUS</title>
      <link rel="stylesheet" href="css/estilos_docente.css">
<script type="module" src="js/docente.js"></script>    </head>
<body>
<header class="encabezado autenticacion"><a class="marca" href="../index.html"><img src="../img/certus-logo001.png" alt="CERTUS" width="144" height="39"></a></header>
<main>
    <section class="caja-acceso">
  <h1>Iniciar sesión</h1>
  <p class="descripcion">Accede a tus capacitaciones.</p>
  <form id="form-login">
    <div class="campo"><label for="correo">Correo institucional</label>
      <input type="email" id="correo" name="correo" autocomplete="username" placeholder="usuario@certus.edu.pe" required></div>
    <div class="campo"><label for="clave">Contraseña</label>
      <div class="entrada-clave"><input type="password" id="clave" name="clave" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
        <button type="button" class="mostrar-clave" data-mostrar-clave="clave" aria-label="Mostrar contraseña">Mostrar</button></div></div>
    <label class="fila-formulario"><input type="checkbox" id="recordar"> Recordar mi correo</label>
    <p class="mensaje" id="mensaje-login" role="alert" aria-live="polite"></p>
    <button type="submit" class="boton bloque">Ingresar</button>
    <a class="enlace-inferior" href="recuperar_contrasena.html">¿Olvidaste tu contraseña?</a>
  </form>
</section>
</main>
<footer class="pie">2026 CERTUS - EDUCACIÓN SUPERIOR</footer>
</body>
</html>
